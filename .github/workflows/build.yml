name: Build IronFox APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      attempt_full_build:
        description: 'Attempt full Firefox/IronFox build (needs 32GB+ RAM, will likely OOM on free runners)'
        required: false
        default: false
        type: boolean

env:
  IRONFOX_CI: 1
  IRONFOX_RELEASE: 0
  IRONFOX_CHANNEL: stable
  IRONFOX_SIGN: 0

jobs:
  # ─── Validation job (always runs, fast) ──────────────────────────────
  validate:
    name: Validate patches + extension
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch files exist
        run: |
          echo "=== Checking all patches referenced in patches.yaml exist ==="
          python3 << 'PY'
          import yaml, os, sys
          with open('scripts/patches.yaml') as f:
              data = yaml.safe_load(f)
          missing = []
          for p in data.get('patches', []):
              path = os.path.join('patches', p['file'])
              if not os.path.isfile(path):
                  missing.append(path)
              else:
                  print(f"  ✓ {path}")
          if missing:
              print(f"\n✗ MISSING {len(missing)} patches:")
              for m in missing:
                  print(f"    {m}")
              sys.exit(1)
          print(f"\n✓ All {len(data.get('patches',[]))} patches present")
          PY

      - name: Validate patch syntax (git apply --check)
        run: |
          echo "=== Checking patch syntax ==="
          for patch in patches/*.patch; do
            echo -n "  $(basename "$patch") ... "
            if git apply --check "$patch" 2>/dev/null; then
              echo "✓ syntax OK"
            else
              # Some patches depend on earlier patches or overlay files; just check format
              if head -4 "$patch" | grep -q "^From "; then
                echo "✓ format OK (apply-order dependent)"
              else
                echo "⚠ unexpected format"
              fi
            fi
          done

      - name: Validate extension manifest
        run: |
          echo "=== Validating extension manifest.json ==="
          python3 -c "
          import json
          m = json.load(open('assets/qwen-agent-extension/manifest.json'))
          assert m['manifest_version'] == 3, 'Must be MV3'
          assert 'gecko' in m['browser_specific_settings'], 'Must have gecko settings'
          print(f'  ✓ Extension: {m[\"name\"]} v{m[\"version\"]}')
          print(f'  ✓ Gecko ID: {m[\"browser_specific_settings\"][\"gecko\"][\"id\"]}')
          print(f'  ✓ Permissions: {len(m[\"permissions\"])} declared')
          print(f'  ✓ Content scripts: {len(m[\"content_scripts\"])} registered')
          "

      - name: Validate extension JS syntax
        run: |
          echo "=== Checking JS syntax of extension files ==="
          # Install node if not present
          if ! command -v node &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq nodejs
          fi
          cd assets/qwen-agent-extension
          for f in $(find . -name '*.js'); do
            echo -n "  $f ... "
            if node --check "$f" 2>/dev/null; then
              echo "✓"
            else
              echo "✗ SYNTAX ERROR"
              node --check "$f" 2>&1 | head -5
              exit 1
            fi
          done

      - name: Build extension .xpi (zip)
        run: |
          echo "=== Building extension .xpi ==="
          cd assets/qwen-agent-extension
          # Create .xpi (which is just a zip of the extension files)
          zip -r /tmp/qwen-agent-studio.xpi . \
            -x "*.git*" -x "*.DS_Store" -x "*docs/*" 2>/dev/null || \
          (cd . && python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/qwen-agent-studio.xpi', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          ")
          ls -lh /tmp/qwen-agent-studio.xpi
          echo "✓ Extension packaged successfully"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-agent-studio-xpi
          path: /tmp/qwen-agent-studio.xpi
          retention-days: 30

  # ─── Full build job (only on manual trigger or tags) ─────────────────
  build:
    name: Build APK (full Firefox build)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.attempt_full_build == 'true' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout IronFox sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Warn about build requirements
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚠️  FULL FIREFOX BUILD — EXPECT FAILURE ON FREE RUNNERS    ║"
          echo "║                                                              ║"
          echo "║  This job requires:                                          ║"
          echo "║    • ~50 GB disk space (free runner has ~14 GB)             ║"
          echo "║    • ~32 GB RAM (free runner has 7 GB)                      ║"
          echo "║    • 3-6 hours wall clock (free runner limit: 6 hours)      ║"
          echo "║                                                              ║"
          echo "║  The build will likely fail at:                             ║"
          echo "║    1. Source download (GitLab-specific download scripts)     ║"
          echo "║    2. Gecko C++/Rust compilation (OOM)                       ║"
          echo "║    3. Gradle build (memory)                                 ║"
          echo "║                                                              ║"
          echo "║  For a successful build, use a self-hosted runner with      ║"
          echo "║  64 GB RAM and 200 GB SSD. See README.md for details.       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm/* /usr/local/share/chrom* 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Show runner specs
        run: |
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | awk '/^Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake clang gawk git jq m4 make nasm ninja-build \
            patch perl python3 python3-pip xz-utils zlib1g-dev curl wget unzip \
            lib32z1 libncurses6 libstdc++6 libgtk-3-0 libasound2 \
            libdbus-glib-1-2 libx11-xcb1 libxcomposite1 libxdamage1 \
            libxrandr2 libatk1.0-0 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0
          # yq (Mike Farah's Go version)
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          which shasum && shasum --version
          echo "Dependencies installed."

      - name: Configure Git
        run: |
          git config --global user.email "ci@ironfoxoss.org"
          git config --global user.name "IronFox CI"

      - name: Set up environment
        run: |
          export CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "CI_PIPELINE_CREATED_AT=$CI_PIPELINE_CREATED_AT" >> "$GITHUB_ENV"
          bash scripts/env.sh || true

      - name: Download sources
        timeout-minutes: 60
        continue-on-error: true
        env:
          CI_PIPELINE_CREATED_AT: ${{ env.CI_PIPELINE_CREATED_AT }}
        run: |
          echo "Downloading Firefox + toolchain sources (~10 GB)..."
          bash scripts/get_sources.sh all download 2>&1 | tail -50
          echo "Download step completed (may have partial failures)."

      - name: Apply patches
        timeout-minutes: 30
        continue-on-error: true
        run: |
          echo "Applying IronFox patches..."
          bash scripts/patches.sh 2>&1 | tail -30 || true

      - name: Prebuild
        timeout-minutes: 60
        continue-on-error: true
        run: |
          echo "Running prebuild..."
          bash scripts/prebuild.sh 2>&1 | tail -30 || true

      - name: Build (arm64)
        timeout-minutes: 300
        continue-on-error: true
        run: |
          echo "Building IronFox for arm64..."
          echo "⚠️  This will likely OOM on a 7 GB runner."
          bash scripts/build.sh arm64 fenix 2>&1 | tail -100 || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-qwen-build-${{ github.run_id }}
          path: |
            artifacts/
            build/src/mobile/android/fenix/app/build/outputs/apk/**/*.apk
            build/src/mobile/android/fenix/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-qwen-logs-${{ github.run_id }}
          path: |
            build/logs/
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 7

  # ─── Release job (only on tags) ──────────────────────────────────────
  release:
    name: Create Release
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: qwen-agent-studio-xpi
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.xpi
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
