name: Build IronFox APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      attempt_full_build:
        description: 'Attempt full Firefox/IronFox build (needs 32GB+ RAM, will likely OOM on free runners)'
        required: false
        default: false
        type: boolean

env:
  IRONFOX_CI: 1
  IRONFOX_RELEASE: 0
  IRONFOX_CHANNEL: stable
  IRONFOX_SIGN: 0

jobs:
  # ─── Validation job (always runs, fast) ──────────────────────────────
  validate:
    name: Validate patches + extension
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch files exist
        run: |
          echo "=== Checking all patches referenced in patches.yaml exist ==="
          python3 << 'PY'
          import yaml, os, sys
          with open('scripts/patches.yaml') as f:
              data = yaml.safe_load(f)
          missing = []
          for p in data.get('patches', []):
              path = os.path.join('patches', p['file'])
              if not os.path.isfile(path):
                  missing.append(path)
              else:
                  print(f"  ✓ {path}")
          if missing:
              print(f"\n✗ MISSING {len(missing)} patches:")
              for m in missing:
                  print(f"    {m}")
              sys.exit(1)
          print(f"\n✓ All {len(data.get('patches',[]))} patches present")
          PY

      - name: Validate patch syntax (git apply --check)
        run: |
          echo "=== Checking patch syntax ==="
          for patch in patches/*.patch; do
            echo -n "  $(basename "$patch") ... "
            if git apply --check "$patch" 2>/dev/null; then
              echo "✓ syntax OK"
            else
              # Some patches depend on earlier patches or overlay files; just check format
              if head -4 "$patch" | grep -q "^From "; then
                echo "✓ format OK (apply-order dependent)"
              else
                echo "⚠ unexpected format"
              fi
            fi
          done

      - name: Validate extension manifest
        run: |
          echo "=== Validating extension manifest.json ==="
          python3 -c "
          import json
          m = json.load(open('assets/qwen-agent-extension/manifest.json'))
          assert m['manifest_version'] == 3, 'Must be MV3'
          assert 'gecko' in m['browser_specific_settings'], 'Must have gecko settings'
          print(f'  ✓ Extension: {m[\"name\"]} v{m[\"version\"]}')
          print(f'  ✓ Gecko ID: {m[\"browser_specific_settings\"][\"gecko\"][\"id\"]}')
          print(f'  ✓ Permissions: {len(m[\"permissions\"])} declared')
          print(f'  ✓ Content scripts: {len(m[\"content_scripts\"])} registered')
          "

      - name: Validate extension JS syntax
        run: |
          echo "=== Checking JS syntax of extension files ==="
          # Install node if not present
          if ! command -v node &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq nodejs
          fi
          cd assets/qwen-agent-extension
          for f in $(find . -name '*.js'); do
            echo -n "  $f ... "
            if node --check "$f" 2>/dev/null; then
              echo "✓"
            else
              echo "✗ SYNTAX ERROR"
              node --check "$f" 2>&1 | head -5
              exit 1
            fi
          done

      - name: Build extension .xpi (zip)
        run: |
          echo "=== Building extension .xpi ==="
          cd assets/qwen-agent-extension
          # Create .xpi (which is just a zip of the extension files)
          zip -r /tmp/qwen-agent-studio.xpi . \
            -x "*.git*" -x "*.DS_Store" -x "*docs/*" 2>/dev/null || \
          (cd . && python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/qwen-agent-studio.xpi', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          ")
          ls -lh /tmp/qwen-agent-studio.xpi
          echo "✓ Extension packaged successfully"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-agent-studio-xpi
          path: /tmp/qwen-agent-studio.xpi
          retention-days: 30

  # ─── Full build job (only on manual trigger or tags) ─────────────────
  build:
    name: Build APK (in Docker, full Firefox build)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.attempt_full_build == 'true' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout IronFox sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Warn about build requirements
        run: |
          cat <<'BANNER'
          ╔══════════════════════════════════════════════════════════════╗
          ║  ⚠️  FULL FIREFOX BUILD — EXPECT FAILURE ON FREE RUNNERS    ║
          ║                                                              ║
          ║  This job runs the build inside the official IronFox Docker  ║
          ║  image (Fedora 43) which has all required tools.             ║
          ║                                                              ║
          ║  Requirements for SUCCESS:                                   ║
          ║    • ~50 GB disk space (free runner has ~14 GB)             ║
          ║    • ~32 GB RAM (free runner has 7 GB — will OOM)           ║
          ║    • 3-6 hours wall clock (free runner limit: 6 hours)      ║
          ║                                                              ║
          ║  The build will likely fail at Gecko C++/Rust compilation   ║
          ║  due to OOM. For a successful build, use a self-hosted      ║
          ║  runner with 64 GB RAM and 200 GB SSD.                      ║
          ╚══════════════════════════════════════════════════════════════╝
          BANNER

      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm/* /usr/local/share/chrom* 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Show runner specs
        run: |
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | awk '/^Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"

      - name: Pull IronFox Docker image
        run: |
          echo "Pulling IronFox build image (Fedora 43 with all build tools)..."
          docker pull registry.gitlab.com/ironfox-oss/ironfox:latest
          echo "✓ Docker image pulled"

      - name: Run build in Docker
        timeout-minutes: 330
        run: |
          echo "=== Running IronFox build inside Docker container ==="
          echo "This will: download sources → apply patches → prebuild → build APK"
          echo "Expected time: 3-6 hours (if it doesn't OOM first)"
          echo ""

          # Run the full build pipeline inside the IronFox Docker image
          # The container has Fedora 43 with all required tools (curl with --clobber,
          # yq, shasum, clang, nasm, etc.)
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            -e IRONFOX_CI=1 \
            -e IRONFOX_RELEASE=0 \
            -e IRONFOX_CHANNEL=stable \
            -e IRONFOX_SIGN=0 \
            -e CI_PIPELINE_CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --memory=6g \
            --memory-swap=6g \
            --cpus=3 \
            registry.gitlab.com/ironfox-oss/ironfox:latest \
            /bin/bash -c '
              set -e
              echo "=== Inside IronFox Docker container ==="
              cat /etc/os-release | head -3
              echo ""
              echo "=== Tool versions ==="
              curl --version | head -1
              yq --version
              shasum --version
              echo ""

              echo "=== Step 1/4: Initialize environment ==="
              bash scripts/env.sh
              echo ""

              echo "=== Step 2/4: Download sources (~10 GB) ==="
              bash scripts/get_sources.sh all download 2>&1 | tail -30
              echo ""

              echo "=== Step 3/4: Apply patches + prebuild ==="
              bash scripts/patches.sh 2>&1 | tail -20
              bash scripts/prebuild.sh 2>&1 | tail -20
              echo ""

              echo "=== Step 4/4: Build APK (arm64) ==="
              echo "⚠️  This is where it will likely OOM on 6 GB RAM limit"
              bash scripts/build.sh arm64 fenix 2>&1 | tail -50
              echo ""

              echo "=== Build pipeline finished ==="
              find build/src/mobile/android/fenix/app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null || true
            ' || echo "Docker build exited with error (expected — see logs above)"

      - name: Find any APK/AAB artifacts produced
        if: always()
        run: |
          echo "=== Searching for build outputs ==="
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
          echo ""
          echo "=== Build artifacts directory ==="
          ls -la artifacts/ 2>/dev/null || echo "(no artifacts dir)"
          ls -la artifacts/apk/ 2>/dev/null || echo "(no apk dir)"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-qwen-build-${{ github.run_id }}
          path: |
            artifacts/
            build/src/mobile/android/fenix/app/build/outputs/apk/**/*.apk
            build/src/mobile/android/fenix/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-qwen-logs-${{ github.run_id }}
          path: |
            build/logs/
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 7

  # ─── Release job (only on tags) ──────────────────────────────────────
  release:
    name: Create Release
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: qwen-agent-studio-xpi
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.xpi
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
